<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tokyo Neon Schwarzlicht Minigolf – Klasse 10C</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Datei -->
    <link rel="stylesheet" href="10c-minigolf.css">

    <!-- Yamatoshi Schrift -->
    <style>
        @font-face {
            font-family: 'Yamatoshi';
            src: url('fonts/Yamatoshi.ttf') format('truetype');
        }

        h1, h2, h3 {
            font-family: 'Yamatoshi', sans-serif;
        }
    </style>
</head>

<body>

<header>
    <h1>Tokyo MiniGolf 10C</h1>
</header>

<section id="scoreboard">
    <h2>Scoreboard</h2>

    <table>
        <thead>
            <tr>
                <th>Spieler</th>
                <th>Schläge</th>
                <th>R1</th>
                <th>R2</th>
                <th>R3</th>
                <th>R4</th>
                <th>R5</th>
                <th>R6</th>
            </tr>
        </thead>

        <tbody id="scoreBody">
            <tr>
                <td>Spieler 1</td>
                <td class="total">0</td>
                <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
                <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
                <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
                <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
                <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
                <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
            </tr>
        </tbody>
    </table>

    <button id="addPlayerBtn">Spieler hinzufügen</button>
    <button id="updateBtn">Update</button>
</section>

<section id="halloffame">
    <h2>🏆 Hall of Fame 🏆</h2>

    <div class="hof-grid">
        <div class="hof-card"><h3>Platz 1</h3></div>
        <div class="hof-card"><h3>Platz 2</h3></div>
        <div class="hof-card"><h3>Platz 3</h3></div>
        <div class="hof-card"><h3>Platz 4</h3></div>
        <div class="hof-card"><h3>Platz 5</h3></div>
        <div class="hof-card"><h3>Platz 6</h3></div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const scoreBody = document.getElementById('scoreBody');
    const updateBtn = document.getElementById('updateBtn');
    const addPlayerBtn = document.getElementById('addPlayerBtn');

    // 0 löschen beim Anklicken
    document.addEventListener('focusin', function(e){
        if(e.target.classList.contains('score-input') && e.target.value === "0"){
            e.target.value = "";
        }
    });

    // 0 wieder einsetzen wenn leer
    document.addEventListener('focusout', function(e){
        if(e.target.classList.contains('score-input') && e.target.value === ""){
            e.target.value = "0";
        }
    });

    // Update Button
    updateBtn.addEventListener('click', () => {

        const rows = Array.from(scoreBody.querySelectorAll('tr'));

        rows.forEach(row => {
            let total = 0;

            row.querySelectorAll('.score-input').forEach(input => {
                let val = parseInt(input.value);
                if(isNaN(val) || val < 0) val = 0;
                if(val > 6) val = 6;
                input.value = val;
                total += val;
            });

            row.querySelector('.total').textContent = total;
        });

        // Sortieren
        rows.sort((a, b) => {
            return parseInt(a.querySelector('.total').textContent) -
                   parseInt(b.querySelector('.total').textContent);
        });

        rows.forEach(row => scoreBody.appendChild(row));
    });

    // Spieler hinzufügen
    addPlayerBtn.addEventListener('click', () => {

        const num = scoreBody.children.length + 1;
        const newRow = document.createElement('tr');

        newRow.innerHTML = `
            <td>Spieler ${num}</td>
            <td class="total">0</td>
            <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
            <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
            <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
            <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
            <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
            <td><input type="number" min="0" max="6" value="0" class="score-input"></td>
        `;

        scoreBody.appendChild(newRow);
    });

});
</script>

</body>
</html>
