<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokyo Neon Schwarzlicht Minigolf – Klasse 10C</title>
    <link rel="stylesheet" href="10c-minigolf.css" />

    <style>
        .winner {
            background: rgba(255, 215, 0, 0.15) !important;
            box-shadow: 0 0 25px gold;
        }
    </style>
</head>

<body>

<section class="big-logo-section">
    <div class="logo-frame">
        <img src="minigolf2.png" alt="Projekt Logo" class="big-logo-img">
    </div>
</section>

<header class="header">
    <h1 class="logo">Tokyo MiniGolf 10C</h1>
    <nav class="nav">
        <a href="#scoreboard">Scoreboard</a>
    </nav>
</header>

<section id="scoreboard" class="section">
    <h2>Scoreboard</h2>

    <div class="scoreboard-container">
        <table class="scoreboard-table">
            <thead>
                <tr>
                    <th>Spieler</th>
                    <th>Punkte</th>
                    <th>R1</th>
                    <th>R2</th>
                    <th>R3</th>
                    <th>R4</th>
                    <th>R5</th>
                </tr>
            </thead>

            <tbody id="scoreBody"></tbody>
        </table>

        <button id="addRowBtn" class="neon-btn">➕ Spieler hinzufügen</button>
        <button id="resetScoreBtn" class="neon-btn danger">✖ Zurücksetzen</button>
    </div>
</section>

<footer class="footer">
    <p>© 2025/26 – Klasse 10C</p>
</footer>

<script>
const scoreBody = document.getElementById("scoreBody");

// 4 Standard-Spieler
function createDefaultPlayers() {
    scoreBody.innerHTML = `
        ${createRowHTML("Spieler 1")}
        ${createRowHTML("Spieler 2")}
        ${createRowHTML("Spieler 3")}
        ${createRowHTML("Spieler 4")}
    `;
}

// HTML für eine Zeile
function createRowHTML(name) {
    return `
        <tr>
            <td contenteditable="true">${name}</td>
            <td class="total">0</td>
            <td contenteditable="true" class="round">0</td>
            <td contenteditable="true" class="round">0</td>
            <td contenteditable="true" class="round">0</td>
            <td contenteditable="true" class="round">0</td>
            <td contenteditable="true" class="round">0</td>
        </tr>
    `;
}

// Punkte berechnen
function calculateRow(row) {
    const rounds = row.querySelectorAll(".round");
    let sum = 0;

    rounds.forEach(cell => {
        const value = parseInt(cell.innerText);
        if (!isNaN(value)) sum += value;
    });

    row.querySelector(".total").innerText = sum;
}

// Sortieren
function sortTable() {
    const rows = Array.from(scoreBody.querySelectorAll("tr"));

    rows.sort((a, b) => {
        const aScore = parseInt(a.querySelector(".total").innerText) || 0;
        const bScore = parseInt(b.querySelector(".total").innerText) || 0;
        return aScore - bScore;
    });

    rows.forEach(row => scoreBody.appendChild(row));
    highlightWinner();
}

// Gewinner markieren
function highlightWinner() {
    const rows = scoreBody.querySelectorAll("tr");
    rows.forEach(row => row.classList.remove("winner"));

    if (rows.length > 0) {
        rows[0].classList.add("winner");
    }
}

// Speichern
function saveScoreboard() {
    localStorage.setItem("scoreboard", scoreBody.innerHTML);
}

// Live-Reaktion
document.addEventListener("input", function(e) {
    if (e.target.classList.contains("round")) {
        const row = e.target.closest("tr");
        calculateRow(row);
        sortTable();
    }
    saveScoreboard();
});

// Neuer Spieler
document.getElementById("addRowBtn").onclick = () => {
    scoreBody.insertAdjacentHTML("beforeend", createRowHTML("Neuer Spieler"));
    saveScoreboard();
};

// Reset
document.getElementById("resetScoreBtn").onclick = () => {
    if (confirm("Scoreboard wirklich zurücksetzen?")) {
        localStorage.removeItem("scoreboard");
        createDefaultPlayers();
        sortTable();
    }
};

// Beim Laden
window.onload = () => {
    const saved = localStorage.getItem("scoreboard");

    if (saved) {
        scoreBody.innerHTML = saved;
    } else {
        createDefaultPlayers();
    }

    sortTable();
};
</script>

</body>
</html>
