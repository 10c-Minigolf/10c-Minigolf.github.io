<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tokyo Neon Cyberpunk</title>
    <link rel="stylesheet" href="minigolf.css">
</head>
<body>

<header class="header">
    <div class="logo">TOKYO NEON</div>
     <img src="minigolf2.png" alt="Tokyo Neon Logo" class="logo-img">
    <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Gallery</a>
        <a href="#">Scoreboard</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome</h2>
    <div class="kanji">東京</div>
</section>

<section class="section">
    <h2>Courses</h2>
    <div class="course-grid">
        <div class="course">Course 1</div>
        <div class="course">Course 2</div>
        <div class="course">Course 3</div>
    </div>
</section>

<section class="section">
    <h2>Gallery</h2>
    <div class="gallery-grid">
        <div class="img-placeholder">Image</div>
        <div class="img-placeholder">Image</div>
        <div class="img-placeholder">Image</div>
    </div>
</section>

<section class="section">
    <h2>⭐ SCOREBOARD ⭐</h2>

    <div class="scoreboard-container">
        <table class="scoreboard-table">
            <thead>
                <tr>
                    <th>Spieler</th>
                    <th>Runde 1</th>
                    <th>Runde 2</th>
                    <th>Runde 3</th>
                    <th>Runde 4</th>
                    <th>Runde 5</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td contenteditable="true">Player 1</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                </tr>
                <tr>
                    <td contenteditable="true">Player 2</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                </tr>
                <tr>
                    <td contenteditable="true">Player 3</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">0</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

<section class="big-logo-section">
    <div class="logo-frame">
        <h1>TOKYO NEON</h1>
    </div>
</section>

<footer class="footer">
    © 2026 Tokyo Neon
</footer>

</body>
</html>
